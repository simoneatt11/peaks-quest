<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f2ea">
  <meta name="description" content="Peaks Quest: a three-minute game about what Beyond Swiss Peaks does.">
  <title>Peaks Quest · Beyond Swiss Peaks</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-2 -2 32 24'%3E%3Cpath d='M0 19 L8 6 L14 14 L20 4 L28 19' fill='none' stroke='%2314140f' stroke-width='2.4' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="texture" aria-hidden="true">
    <svg viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
      <circle cx="340" cy="90" r="70"/><circle cx="40" cy="520" r="110"/>
      <rect x="250" y="640" width="90" height="90"/><line x1="0" y1="300" x2="120" y2="300"/>
      <circle cx="360" cy="420" r="22"/><rect x="30" y="140" width="40" height="40"/>
    </svg>
  </div>

  <header class="top">
    <div class="brand">
      <svg class="peaks" viewBox="0 0 28 20" aria-hidden="true"><path d="M0 19 L8 6 L14 14 L20 4 L28 19"/></svg>
      <span>Beyond Swiss Peaks</span>
    </div>
    <div class="health" id="health" hidden>
      <div class="health-row"><span class="label" id="health-label"></span><span class="health-stage" id="health-stage"></span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0" id="health-bar"><span></span></div>
    </div>
  </header>

  <main>
    <!-- Screen 1: Start -->
    <section class="screen" id="screen-start" aria-labelledby="start-h">
      <div class="start-inner">
        <svg class="peaks peaks-hero" viewBox="-1 -1 30 22" aria-hidden="true"><path d="M0 19 L8 6 L14 14 L20 4 L28 19"/></svg>
        <p class="label">Peaks Quest</p>
        <h1 id="start-h"></h1>
        <p class="lede" id="start-sub"></p>
        <button class="btn primary" id="btn-start"></button>
      </div>
      <footer class="foot"><a id="start-link" target="_blank" rel="noopener"></a></footer>
    </section>

    <!-- Screen 2: Avatar -->
    <section class="screen" id="screen-avatar" aria-labelledby="avatar-h" hidden>
      <div class="pad">
        <p class="label" id="avatar-label"></p>
        <h1 id="avatar-h"></h1>
        <div class="avatar-grid" id="avatar-grid" role="radiogroup" aria-labelledby="avatar-h"></div>
        <div class="type-q">
          <p class="type-label" id="type-label"></p>
          <div class="seg" id="type-seg" role="radiogroup" aria-labelledby="type-label"></div>
        </div>
        <button class="btn primary wide" id="btn-go"></button>
      </div>
    </section>

    <!-- Screen 3: Map -->
    <section class="screen" id="screen-map" aria-label="Map" hidden>
      <div class="map-wrap" id="map-wrap">
        <svg id="map" viewBox="0 0 360 730" preserveAspectRatio="xMidYMid meet" aria-label="Map with eight stations"></svg>
        <p class="map-say" id="map-say" aria-live="polite"></p>
        <p class="toast" id="toast" aria-live="polite"></p>
      </div>
      <div class="map-foot">
        <p class="hint" id="map-hint"></p>
        <button class="btn small" id="btn-next"></button>
      </div>
    </section>

    <!-- Screen 5: Finish -->
    <section class="screen" id="screen-finish" aria-labelledby="finish-h" hidden>
      <div class="pad finish">
        <svg class="celebrate" viewBox="0 0 120 70" aria-hidden="true">
          <circle class="ring r1" cx="60" cy="40" r="20"/><circle class="ring r2" cx="60" cy="40" r="20"/>
          <path class="draw" d="M20 60 L42 24 L60 46 L78 18 L100 60"/>
        </svg>
        <p class="label" id="finish-label"></p>
        <h1 id="finish-h"></h1>
        <ul class="chips" id="finish-chips"></ul>
        <p class="lede" id="finish-summary"></p>
        <div class="cta">
          <a class="btn primary wide" id="btn-book"></a>
          <div class="cta-row">
            <a class="btn" id="btn-visit" target="_blank" rel="noopener"></a>
            <a class="btn" id="btn-follow" target="_blank" rel="noopener"></a>
          </div>
        </div>
        <figure class="qr">
          <img src="assets/qr.svg" width="132" height="132" alt="QR code linking to beyondswisspeaks.ch">
          <figcaption><span class="label" id="qr-label"></span><span id="qr-url"></span></figcaption>
        </figure>
        <button class="btn ghost" id="btn-again"></button>
        <p class="legal" id="finish-legal"></p>
      </div>
    </section>
  </main>

  <!-- Screen 4: Mission overlay -->
  <div class="overlay" id="overlay" hidden>
    <div class="backdrop" id="backdrop"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="m-title">
      <div class="sheet-top">
        <span class="label" id="m-label"></span>
        <button class="link-btn" id="m-close"></button>
      </div>
      <h2 id="m-title"></h2>
      <div class="say"><span class="mini" id="m-mini" aria-hidden="true"></span><p class="bubble" id="m-say"></p></div>
      <p class="setup" id="m-setup"></p>
      <div class="m-body" id="m-body"></div>
      <p class="feedback" id="m-feedback" aria-live="polite"></p>
      <div class="m-success" id="m-success" hidden>
        <p class="irl"><span class="label" id="m-irl-label"></span><span id="m-irl"></span></p>
        <button class="btn primary wide" id="m-continue"></button>
      </div>
      <button class="skip" id="m-skip"></button>
    </section>
  </div>

  <script src="content.js"></script>
  <script src="game.js"></script>
</body>
</html>
